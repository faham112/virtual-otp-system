name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/html/virtual-otp-system

            echo "==> Pulling latest code"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            test -f backend/.env
            test -f frontend/.env.production

            echo "==> Installing backend dependencies"
            python3 -m venv backend/venv 2>/dev/null || true
            backend/venv/bin/python -m pip install --upgrade pip -q
            backend/venv/bin/pip install -r backend/requirements.txt

            echo "==> Installing and building frontend"
            cd frontend
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
            cd ..

            echo "==> Validating and reloading Nginx"
            sudo nginx -t
            sudo systemctl daemon-reload

            echo "==> Restarting production services"
            sudo systemctl restart otp-backend.service otp-frontend.service
            sudo systemctl is-active --quiet otp-backend.service
            sudo systemctl is-active --quiet otp-frontend.service
            curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
            sudo systemctl reload nginx
            echo "==> Production deployment completed successfully"
